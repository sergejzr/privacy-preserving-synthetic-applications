[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-preserving-synthetic-applications"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.23",
    "pydantic>=2",
    "jinja2>=3",
    "pyyaml>=6",
    "httpx>=0.26",
    "pillow>=10",
    "weasyprint>=60",
]

[project.scripts]
synthetic-apps = "synthetic_apps.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["synthetic_apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
